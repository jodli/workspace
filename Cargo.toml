[package]
name = "ws"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Multi-repo worktree workspace driver, built to be called by coding agents"
license = "MIT"
repository = "https://github.com/jodli/workspace"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dunce = "1.0.5"
filetime = "0.2.29"
jiff = { version = "0.2.39", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
thiserror = "2.0.21"
toml = "1.1.8"
walkdir = "2.5.0"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["fs"] }

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# git ref rules are case-sensitive, so `.lock` must be too
case_sensitive_file_extension_comparisons = "allow"
